battery all {
        format = "%status %percentage %remaining"
        format_down = "No battery"
        status_chr = "CHR"
        status_bat = "BAT"
        status_unk = "UNK"
        status_full = "FULL"
        status_idle = "IDLE"
        integer_battery_capacity = true
        # Base percentage on the battery's real full capacity, not its design capacity
        last_full_capacity = true
        low_threshold = 15
        threshold_type = percentage
        hide_seconds = true
}

# Works with PulseAudio and ALSA. %icon picks a symbol for the volume level.
volume master {
        format = "%icon %volume"
        format_muted = "%icon muted"
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

tztime local {
        format = "%a %Y-%m-%d %H:%M"
}
