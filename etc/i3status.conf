# i3status configuration file (improved).
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 5

        # Colors that read well on both dark and light i3bar themes
        color_good     = "#A3BE8C"
        color_degraded = "#EBCB8B"
        color_bad      = "#BF616A"

        # Separator is only used by the plain/dzen2/xmobar output formats;
        # with i3bar, the bar's own separator settings apply.
        separator = "|"
}

# Order: network -> resources -> audio -> power -> time
order += "wireless _first_"
order += "ethernet _first_"
order += "cpu_usage"
order += "load"
order += "memory"
order += "disk /"
order += "volume master"
order += "battery all"
order += "tztime local"

# IPv6 removed from the default order: it is rarely useful and is noisy
# when it is down. Re-add with:  order += "ipv6"

wireless _first_ {
        format_up = "W: %quality %essid %ip"
        format_down = "W: down"
        format_quality = "%d%s"
}

ethernet _first_ {
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

cpu_usage {
        format = "CPU %usage"
        max_threshold = 85
        degraded_threshold = 60
}

load {
        format = "L %1min"
        max_threshold = "4"
}

memory {
        format = "RAM %used/%total"
        threshold_degraded = "15%"
        threshold_critical = "5%"
        format_degraded = "RAM LOW %available free"
}

disk "/" {
        format = "/ %avail"
        low_threshold = 10
        threshold_type = percentage_avail
        format_below_threshold = "/ LOW %avail"
}

volume master {
        format = "♪ %volume"
        format_muted = "♪ muted"
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

battery all {
        format = "%status %percentage %remaining"
        format_down = "No battery"
        status_chr = "CHR"
        status_bat = "BAT"
        status_unk = "UNK"
        status_full = "FULL"
        status_idle = "IDLE"
        integer_battery_capacity = true
        # Base percentage on the battery's real full capacity, not its design capacity
        last_full_capacity = true
        low_threshold = 15
        threshold_type = percentage
        hide_seconds = true
}

tztime local {
        format = "%a %Y-%m-%d %H:%M"
}
