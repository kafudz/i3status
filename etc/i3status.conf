# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 5
}

# Uncomment the modules you do not need to disable them, or add more
# (cpu_temperature, brightness, read_file, run_watch, ...). See "man i3status".
# order += "ipv6"
order += "brightness"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "disk /"
order += "cpu_usage"
order += "load"
order += "memory"
order += "volume master"
order += "tztime local"

brightness {
        format = "%device: %percentage"
        # Optional: select a specific device, a glob, or the brightness file.
        path = "/sys/class/backlight/intel_backlight"
}

wireless _first_ {
        format_up = "W: (%quality at %essid) %ip"
        format_down = "W: down"
}

ethernet _first_ {
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

battery all {
        format = "%status %percentage %remaining"
        # Turn red when less than 15 minutes of battery are left.
        threshold_type = "time"
        low_threshold = 15
        integer_battery_capacity = true
}

disk "/" {
        format = "%avail"
        # Turn red below 10% free space.
        low_threshold = 10
        threshold_type = "percentage_avail"
}

cpu_usage {
        format = "CPU: %usage"
        degraded_threshold = 75
        max_threshold = 90
}

load {
        format = "%1min"
}

memory {
        format = "%used | %available"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

# Works with PulseAudio and ALSA. %icon picks a symbol for the volume level.
volume master {
        format = "%icon %volume"
        format_muted = "%icon muted"
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

# Uses the first backlight device by default. Set path to a specific device
# directory (e.g. /sys/class/backlight/intel_backlight) if needed.
# brightness {
#         format = "B: %percentage"
#         format_down = "no backlight"
# }

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}
